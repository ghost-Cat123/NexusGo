version: '3.8'

services:
  agent:
    build:
      context: .                  # build context 设为项目根目录，Dockerfile 才能 COPY go.mod 等根目录文件
      dockerfile: apps/agent/Dockerfile
    ports:
      - "8050:8050"
    depends_on:
      mysql:
        condition: service_healthy  # 等 MySQL 真正就绪，而不只是容器启动
      redis:
        condition: service_started
      milvus:
        condition: service_started
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  logic:
    build:
      context: .
      dockerfile: apps/logic/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      milvus:
        condition: service_started
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - MILVUS_HOST=milvus

  mysql:
    image: mysql:8.0
    container_name: im-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: IMSystem
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:                        # ★ 新增 healthcheck，让 depends_on condition 生效
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:latest
    container_name: im-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456789
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: im-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: im-etcd
    restart: unless-stopped
    volumes:
      - etcd_data:/etcd-data
    command:                            # ★ 修复：原配置缺少 etcd 启动命令，导致单节点无法正常启动
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=default=http://etcd:2380

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: im-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data

  milvus:
    image: milvusdb/milvus:v2.6.14
    container_name: im-milvus
    restart: unless-stopped
    depends_on:
      - etcd
      - minio
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000          # ★ 修复：正确的环境变量名是 MINIO_ADDRESS，而非 MINIO_ENDPOINT
      MINIO_ACCESS_KEY_ID: minioadmin    # ★ 修复：新版 Milvus 变量名
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus

  attu:
    image: zilliz/attu:v2.5          # v2.5 支持 Milvus 2.5/2.6.x
    container_name: im-attu
    restart: unless-stopped
    ports:
      - "8000:3000"
    depends_on:
      - milvus
    environment:
      MILVUS_URL: http://milvus:19530  # ★ 新版 Attu 需要 http:// 前缀


volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  milvus_data:
  etcd_data:
  minio_data:
