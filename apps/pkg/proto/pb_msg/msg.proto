syntax = "proto3";

package pb_msg;

// protoc --go_out=. --go_opt=module=go-im-system apps/pkg/proto/pb_msg/msg.proto
option go_package = "NexusGo/apps/pkg/proto/pb_msg";

// 发送消息请求
message SendMessageArgs {
  int64 sender_id = 1; // 发送者id
  int64 receiver_id = 2; // 接收者id
  string body = 3; // 消息体
  // 网关生成的全局消息 ID（雪花），与 messages.msg_id 一致；为 0 时由 Logic 自行生成（兼容旧客户端）
  int64 msg_id = 4;
  // 会话内序号，仅用于同一会话内排序；为 0 表示未使用会话序号
  int64 seq_id = 5;
}

// 发送消息响应
message SendMessageReply {
  int64 msg_id = 1;
}

// 同步消息请求
message SyncUnreadArgs {
  int64 receiver_id = 1;
  int64 group_id = 2;
}

// 同步消息响应
message SyncUnreadReply {
  // 定义一个消息体列表
  repeated MessageItem messages = 1;
}

// 消息体
message MessageItem {
  int64 msg_id = 1;
  int64 sender_id = 2;
  int64 group_id = 3;
  string content = 4;
  string create_time = 5;
  int64 seq_id = 6;
  // 发送状态：0 未发送 1 发送未确认 2 发送已确认（与 models 常量一致）
  int32 send_status = 7;
}

// 网关：对端 WS 已成功写入后上报，将 send_status 0 -> 1
message NotifyDeliveredArgs {
  int64 msg_id = 1;
}

message NotifyDeliveredReply {
  bool success = 1;
}

// 读消息列表请求
message ReadMessagesArgs {
  int64 receiver_id = 1;      // 谁读了消息
  // 后续可以扩展：repeated int64 msg_ids = 2; // 具体读了哪几条
}

// 读消息列表响应
message ReadMessagesReply {
  bool success = 1;        // 返回个 true 就行
}

// 读消息ACK
message AckMessageArgs {
  int64 msg_id = 1;
}

message AckMessageReply {
  bool success = 1;
}

message GetConversationsArgs {
  int64 user_id = 1;
}

message ConversationItem {
  int64 target_id = 1;
  int32 session_type = 2; // 1: 单聊, 2: 群聊
  int64 unread_count = 3;
  int64 owner_id = 4;
}

message GetConversationsReply {
  repeated ConversationItem conversations = 1;
}

message GetChatHistoryArgs {
  int64 user_id = 1;
  int64 target_id = 2;
  int64 cursor = 3;
  int64 limit = 4;
}

message GetChatHistoryReply {
  repeated MessageItem messages = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
  int64 target_id = 4;
}

message MarkReadArgs {
  int64 user_id = 1;
  int64 target_id = 2;
  int64 last_read_msg_id = 3;
  int32 session_type = 4;
}

message MarkReadReply {
  bool success = 1;
}

service MsgService {
  rpc SyncUnread(SyncUnreadArgs) returns (SyncUnreadReply);
  rpc NotifyDelivered(NotifyDeliveredArgs) returns (NotifyDeliveredReply);
  rpc AckMessage(AckMessageArgs) returns (AckMessageReply);
  rpc ReadMessages(ReadMessagesArgs) returns (ReadMessagesReply);
  rpc GetConversations(GetConversationsArgs) returns (GetConversationsReply);
  rpc GetChatHistory(GetChatHistoryArgs) returns (GetChatHistoryReply);
  rpc MarkMessageRead(MarkReadArgs) returns (MarkReadReply);
}