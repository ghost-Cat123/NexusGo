syntax = "proto3";

package pb_group;

option go_package = "NexusGo/apps/pkg/proto/pb_group";

message CreateGroupArgs {
  int64 user_id = 1;
  string group_name = 2;
  repeated int64 member_ids = 3;
}

message CreateGroupReply {
  int64 group_id = 1;
}

message GetGroupListArgs {
  int64 user_id = 1;
}

message GroupItem {
  int64 group_id = 1;
  string group_name = 2;
  int64 owner_id = 3;
}

message GetGroupListReply {
  repeated GroupItem groups = 1;
}

message GetGroupInfoArgs {
  int64 group_id = 1;
}

message GetGroupInfoReply {
  int64 group_id = 1;
  string group_name = 2;
  int64 owner_id = 3;
}

message GetGroupMembersArgs {
  int64 group_id = 1;
}

message GroupMemberItem {
  int64 user_id = 1;
  int32 role = 2;
  string nickname = 3;
}

message GetGroupMembersReply {
  repeated GroupMemberItem members = 1;
}

message JoinGroupArgs {
  int64 user_id = 1;
  int64 group_id = 2;
}

message JoinGroupReply {
  bool success = 1;
}

message LeaveGroupArgs {
  int64 user_id = 1;
  int64 group_id = 2;
}

message LeaveGroupReply {
  bool success = 1;
}

message GetGroupHistoryArgs {
  int64 group_id = 1;
  int64 user_id = 2;
  int64 cursor = 3;
  int64 limit = 4;
}

message GetGroupHistoryReply {
  repeated GroupMsgItem messages = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

message GroupMsgItem {
  int64 msg_id = 1;
  int64 sender_id = 2;
  string content = 3;
  string create_time = 4;
}

message DissolveGroupArgs {
  int64 user_id = 1;
  int64 group_id = 2;
}

message DissolveGroupReply {
  bool success = 1;
}

message SearchGroupArgs {
  string keyword = 1;
}

message SearchGroupReply {
  repeated GroupItem groups = 1;
}

service GroupService {
  rpc CreateGroup(CreateGroupArgs) returns (CreateGroupReply);
  rpc GetGroupList(GetGroupListArgs) returns (GetGroupListReply);
  rpc GetGroupInfo(GetGroupInfoArgs) returns (GetGroupInfoReply);
  rpc GetGroupMembers(GetGroupMembersArgs) returns (GetGroupMembersReply);
  rpc JoinGroup(JoinGroupArgs) returns (JoinGroupReply);
  rpc LeaveGroup(LeaveGroupArgs) returns (LeaveGroupReply);
  rpc GetGroupHistory(GetGroupHistoryArgs) returns (GetGroupHistoryReply);
  rpc DissolveGroup(DissolveGroupArgs) returns (DissolveGroupReply);
  rpc SearchGroup(SearchGroupArgs) returns (SearchGroupReply);
}
